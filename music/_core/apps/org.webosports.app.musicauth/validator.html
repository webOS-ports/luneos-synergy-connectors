<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN"
	"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
	<title>Music Account</title>
	<!-- customUI validator for the music account types (org.webosports.app.music.*).
	     Structure mirrors com.palm.app.cloud-auth: enyo.js is an async loader that
	     reads depends.js ($enyo-lib/accounts/ + source/musicAuth.js) BEFORE the
	     body script runs, so MusicAuth is defined by then. Do NOT <script> the
	     source directly here (that races the loader and blanks the page). -->
	<script src="/usr/palm/frameworks/enyo/0.10/framework/enyo.js" type="text/javascript"></script>
</head>
<body>
	<script type="text/javascript">
		new MusicAuth().renderInto(document.body);
	</script>
</body>
</html>
